<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 870" width="1180" height="870" font-family="Menlo, Consolas, monospace" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M1,1 L11,6 L1,11" fill="none" stroke="#1d3557" stroke-width="1.5"/>
    </marker>
  </defs>
  <style>
    .box { fill: #ffffff; stroke: #1d3557; stroke-width: 1.5; }
    .head { fill: #e3eef6; stroke: #1d3557; stroke-width: 1.5; }
    .pattern { fill: #fdf3e1; stroke: #1d3557; stroke-width: 1.5; }
    .title { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-weight: bold; font-size: 15px; fill: #1d3557; }
    .abstract { font-style: italic; }
    .stereo { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 12px; fill: #5b6472; }
    .line { stroke: #1d3557; stroke-width: 1.5; fill: none; }
    .dashed { stroke: #1d3557; stroke-width: 1.5; fill: none; stroke-dasharray: 6 4; }
    .triangle { fill: #ffffff; stroke: #1d3557; stroke-width: 1.5; }
    .label { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 12px; fill: #1d3557; }
    .note { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 12px; fill: #5b6472; }
    text { fill: #1b1f2a; }
  </style>

  <rect width="1180" height="870" fill="#ffffff"/>

  <!-- main.ts (entry point and game loop) -->
  <rect class="box" x="20" y="60" width="320" height="170"/>
  <rect class="head" x="20" y="60" width="320" height="40"/>
  <text class="stereo" x="180" y="76" text-anchor="middle">«module» entry point</text>
  <text class="title" x="180" y="93" text-anchor="middle">main.ts</text>
  <text x="30" y="118">game: Game</text>
  <text x="30" y="136">display: Display</text>
  <text x="30" y="154">frameCount: number</text>
  <line class="line" x1="20" y1="164" x2="340" y2="164"/>
  <text x="30" y="182">setup: game.world.attach(display)</text>
  <text x="30" y="200">frame(): void  (every frame)</text>
  <text x="30" y="218">on keydown: handleKey</text>

  <!-- Game (controller) -->
  <rect class="box" x="400" y="60" width="330" height="188"/>
  <rect class="head" x="400" y="60" width="330" height="40"/>
  <text class="stereo" x="565" y="76" text-anchor="middle">controller</text>
  <text class="title" x="565" y="93" text-anchor="middle">Game</text>
  <text x="410" y="118">+ world: World</text>
  <text x="410" y="136">+ ant: Creature</text>
  <text x="410" y="154">+ rabbit: Creature</text>
  <line class="line" x1="400" y1="164" x2="730" y2="164"/>
  <text x="410" y="182">+ constructor()</text>
  <text x="410" y="200">+ handleKey(key: string): void</text>
  <text x="410" y="218">+ update(): void</text>
  <text x="410" y="236">- moveSelected(dRow, dCol): void</text>

  <!-- Display (view, ConcreteObserver) -->
  <rect class="box" x="790" y="60" width="370" height="224"/>
  <rect class="head" x="790" y="60" width="370" height="40"/>
  <text class="stereo" x="975" y="76" text-anchor="middle">view · ConcreteObserver</text>
  <text class="title" x="975" y="93" text-anchor="middle">Display</text>
  <text x="800" y="118">- world: World</text>
  <text x="800" y="136">- table: HTMLTableElement | null</text>
  <text x="800" y="154">- status: HTMLParagraphElement | null</text>
  <text x="800" y="172">- counters: HTMLParagraphElement | null</text>
  <text x="800" y="190">- renderCount: number = 0</text>
  <line class="line" x1="790" y1="200" x2="1160" y2="200"/>
  <text x="800" y="218">+ constructor(world: World)</text>
  <text x="800" y="236">+ update(subject: Subject): void</text>
  <text x="800" y="254">+ showCounters(frameCount): void</text>
  <text x="800" y="272">+ render(): void</text>

  <!-- Creature -->
  <rect class="box" x="20" y="360" width="270" height="166"/>
  <rect class="head" x="20" y="360" width="270" height="40"/>
  <text class="title" x="155" y="386" text-anchor="middle">Creature</text>
  <text x="30" y="418">+ name: string</text>
  <text x="30" y="436">+ image: string</text>
  <text x="30" y="454">+ row: number</text>
  <text x="30" y="472">+ col: number</text>
  <line class="line" x1="20" y1="482" x2="290" y2="482"/>
  <text x="30" y="500">+ constructor(name, image,</text>
  <text x="139" y="518">row, col)</text>

  <!-- World (model, ConcreteSubject) -->
  <rect class="box" x="370" y="360" width="400" height="206"/>
  <rect class="head" x="370" y="360" width="400" height="40"/>
  <text class="stereo" x="570" y="376" text-anchor="middle">model · ConcreteSubject</text>
  <text class="title" x="570" y="393" text-anchor="middle">World</text>
  <text x="380" y="418">+ grid: (Creature | Food | null)[][]</text>
  <text x="380" y="436">- selected: Creature | null = null</text>
  <line class="line" x1="370" y1="446" x2="770" y2="446"/>
  <text x="380" y="464">+ getSquare(row, col): Creature | Food | null</text>
  <text x="380" y="482">+ getSelected(): Creature | null</text>
  <text x="380" y="500">+ selectCreature(creature): void</text>
  <text x="380" y="518">+ addCreature(creature): void</text>
  <text x="380" y="536">+ addFood(food, row, col): void</text>
  <text x="380" y="554">+ moveCreature(creature, dRow, dCol): void</text>

  <!-- Observer (interface) -->
  <rect class="box" x="850" y="380" width="270" height="76"/>
  <rect class="pattern" x="850" y="380" width="270" height="40"/>
  <text class="stereo" x="985" y="396" text-anchor="middle">«interface»</text>
  <text class="title" x="985" y="413" text-anchor="middle">Observer</text>
  <text x="860" y="444">+ update(subject: Subject): void</text>

  <!-- Subject (abstract) -->
  <rect class="box" x="370" y="640" width="400" height="134"/>
  <rect class="pattern" x="370" y="640" width="400" height="40"/>
  <text class="stereo" x="570" y="656" text-anchor="middle">«abstract»</text>
  <text class="title abstract" x="570" y="673" text-anchor="middle">Subject</text>
  <text x="380" y="698">- observers: Observer[]</text>
  <line class="line" x1="370" y1="708" x2="770" y2="708"/>
  <text x="380" y="726">+ attach(observer: Observer): void</text>
  <text x="380" y="744">+ detach(observer: Observer): void</text>
  <text x="380" y="762"># notify(): void</text>

  <!-- Food -->
  <rect class="box" x="90" y="620" width="200" height="94"/>
  <rect class="head" x="90" y="620" width="200" height="40"/>
  <text class="title" x="190" y="646" text-anchor="middle">Food</text>
  <text x="100" y="678">+ image: string</text>
  <line class="line" x1="90" y1="688" x2="290" y2="688"/>
  <text x="100" y="706">+ constructor(image)</text>

  <!-- main.ts has a Game -->
  <line class="line" x1="340" y1="100" x2="400" y2="100" marker-end="url(#arrow)"/>
  <text class="label" x="370" y="92" text-anchor="middle">game</text>

  <!-- main.ts has a Display (routed over the top of Game) -->
  <path class="line" d="M180,60 L180,30 L975,30 L975,60" marker-end="url(#arrow)"/>
  <text class="label" x="577" y="24" text-anchor="middle">display</text>

  <!-- Game has a World -->
  <line class="line" x1="565" y1="248" x2="565" y2="360" marker-end="url(#arrow)"/>
  <text class="label" x="573" y="308">world</text>

  <!-- Game knows the ant and the rabbit -->
  <line class="line" x1="400" y1="230" x2="230" y2="360" marker-end="url(#arrow)"/>
  <text class="label" x="300" y="290" text-anchor="end">ant, rabbit</text>

  <!-- Display reads the World -->
  <line class="line" x1="800" y1="284" x2="740" y2="360" marker-end="url(#arrow)"/>
  <text class="label" x="790" y="330">world</text>

  <!-- Display implements Observer (realization) -->
  <line class="dashed" x1="985" y1="284" x2="985" y2="366"/>
  <path class="triangle" d="M985,380 L977,366 L993,366 Z"/>
  <text class="label" x="993" y="330">implements</text>

  <!-- World extends Subject (generalization) -->
  <line class="line" x1="570" y1="566" x2="570" y2="626"/>
  <path class="triangle" d="M570,640 L562,626 L578,626 Z"/>
  <text class="label" x="578" y="600">extends</text>

  <!-- Subject has a list of Observers -->
  <path class="line" d="M770,720 L985,720 L985,456" marker-end="url(#arrow)"/>
  <text class="label" x="878" y="712" text-anchor="middle">observers 0..*</text>

  <!-- World's grid holds Creatures and Food -->
  <line class="line" x1="370" y1="470" x2="290" y2="470" marker-end="url(#arrow)"/>
  <text class="label" x="330" y="462" text-anchor="middle">0..*</text>
  <path class="line" d="M370,548 L330,548 L330,667 L290,667" marker-end="url(#arrow)"/>
  <text class="label" x="336" y="610">0..*</text>

  <!-- notes -->
  <text class="note" x="20" y="810">The Observer pattern classes (Subject, Observer) are shaded. World notifies its observers after every change; Display.update() calls render().</text>
  <text class="note" x="20" y="828">Game also creates the Food. Display also uses Creature and Food (instanceof). World.ts also exports WIDTH = 20 and HEIGHT = 12.</text>
  <text class="note" x="20" y="846">→ association    - - ▷ realization (implements)    —▷ generalization (extends)    # protected    italic = abstract</text>
</svg>
