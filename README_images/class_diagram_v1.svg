<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 590" width="960" height="590" font-family="Menlo, Consolas, monospace" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M1,1 L11,6 L1,11" fill="none" stroke="#1d3557" stroke-width="1.5"/>
    </marker>
  </defs>
  <style>
    .box { fill: #ffffff; stroke: #1d3557; stroke-width: 1.5; }
    .head { fill: #e3eef6; stroke: #1d3557; stroke-width: 1.5; }
    .title { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-weight: bold; font-size: 15px; fill: #1d3557; }
    .stereo { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 12px; fill: #5b6472; }
    .line { stroke: #1d3557; stroke-width: 1.5; fill: none; }
    .dashed { stroke: #1d3557; stroke-width: 1.5; fill: none; stroke-dasharray: 6 4; }
    .brace { stroke: #5b6472; stroke-width: 1.5; fill: none; }
    .label { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 12px; fill: #1d3557; }
    .role { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 12px; font-style: italic; fill: #5b6472; }
    .note { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 12px; fill: #5b6472; }
    text { fill: #1b1f2a; }
  </style>

  <rect width="960" height="590" fill="#ffffff"/>

  <!-- main.ts (entry point and game loop) -->
  <rect class="box" x="20" y="40" width="300" height="134"/>
  <rect class="head" x="20" y="40" width="300" height="40"/>
  <text class="stereo" x="170" y="56" text-anchor="middle">«module» entry point</text>
  <text class="title" x="170" y="73" text-anchor="middle">main.ts</text>
  <text x="30" y="98">game: Game</text>
  <text x="30" y="116">frameCount: number</text>
  <line class="line" x1="20" y1="126" x2="320" y2="126"/>
  <text x="30" y="144">frame(): void  (every frame)</text>
  <text x="30" y="162">on keydown: handleKey, render</text>

  <!-- Game: model, view and controller all in one class -->
  <rect class="box" x="400" y="40" width="420" height="296"/>
  <rect class="head" x="400" y="40" width="420" height="40"/>
  <text class="stereo" x="610" y="56" text-anchor="middle">model + view + controller</text>
  <text class="title" x="610" y="73" text-anchor="middle">Game</text>
  <text x="410" y="98">+ grid: (Creature | Food | null)[][]</text>
  <text x="410" y="116">+ ant: Creature</text>
  <text x="410" y="134">+ rabbit: Creature</text>
  <text x="410" y="152">+ selected: Creature</text>
  <text x="410" y="170">- renderCount: number = 0</text>
  <line class="line" x1="400" y1="180" x2="820" y2="180"/>
  <text x="410" y="198">+ constructor()</text>
  <text x="410" y="216">+ getSquare(row, col): Creature | Food | null</text>
  <text x="410" y="234">+ addCreature(creature): void</text>
  <text x="410" y="252">+ addFood(food, row, col): void</text>
  <text x="410" y="270">+ moveCreature(creature, dRow, dCol): void</text>
  <text x="410" y="288">+ handleKey(key: string): void</text>
  <text x="410" y="306">+ showCounters(frameCount): void</text>
  <text x="410" y="324">+ render(): void</text>

  <!-- which job each group of methods does -->
  <path class="brace" d="M828,204 L836,204 L836,274 L828,274"/>
  <text class="role" x="844" y="243">model</text>
  <path class="brace" d="M828,277 L836,277 L836,291 L828,291"/>
  <text class="role" x="844" y="288">controller</text>
  <path class="brace" d="M828,295 L836,295 L836,328 L828,328"/>
  <text class="role" x="844" y="315">view</text>

  <!-- Creature -->
  <rect class="box" x="20" y="250" width="270" height="166"/>
  <rect class="head" x="20" y="250" width="270" height="40"/>
  <text class="title" x="155" y="276" text-anchor="middle">Creature</text>
  <text x="30" y="308">+ name: string</text>
  <text x="30" y="326">+ image: string</text>
  <text x="30" y="344">+ row: number</text>
  <text x="30" y="362">+ col: number</text>
  <line class="line" x1="20" y1="372" x2="290" y2="372"/>
  <text x="30" y="390">+ constructor(name, image,</text>
  <text x="139" y="408">row, col)</text>

  <!-- Food -->
  <rect class="box" x="510" y="420" width="200" height="94"/>
  <rect class="head" x="510" y="420" width="200" height="40"/>
  <text class="title" x="610" y="446" text-anchor="middle">Food</text>
  <text x="520" y="478">+ image: string</text>
  <line class="line" x1="510" y1="488" x2="710" y2="488"/>
  <text x="520" y="506">+ constructor(image)</text>

  <!-- main.ts has a Game -->
  <line class="line" x1="320" y1="100" x2="400" y2="100" marker-end="url(#arrow)"/>
  <text class="label" x="360" y="92" text-anchor="middle">game</text>

  <!-- Game knows the ant, rabbit, and selected creature -->
  <line class="line" x1="400" y1="290" x2="290" y2="290" marker-end="url(#arrow)"/>
  <text class="label" x="345" y="268" text-anchor="middle">ant, rabbit,</text>
  <text class="label" x="345" y="282" text-anchor="middle">selected</text>

  <!-- Game's grid holds Creatures and Food -->
  <line class="line" x1="400" y1="330" x2="290" y2="330" marker-end="url(#arrow)"/>
  <text class="label" x="345" y="322" text-anchor="middle">grid 0..*</text>

  <line class="line" x1="570" y1="336" x2="570" y2="420" marker-end="url(#arrow)"/>
  <text class="label" x="562" y="382" text-anchor="end">grid 0..*</text>

  <!-- Game creates Food -->
  <line class="dashed" x1="660" y1="336" x2="660" y2="420" marker-end="url(#arrow)"/>
  <text class="label" x="668" y="382">«creates»</text>

  <!-- notes -->
  <text class="note" x="20" y="548">Game does every job: it holds the grid and the movement rules, handles key presses, and draws the page.</text>
  <text class="note" x="20" y="566">Game.ts also exports the constants WIDTH = 20 and HEIGHT = 12.</text>
  <text class="note" x="20" y="584">→ association    - - → dependency</text>
</svg>
